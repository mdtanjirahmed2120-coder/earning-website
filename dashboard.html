<!-- Refer & Earn Box -->
<div class="bg-gradient-to-r from-amber-500 to-orange-600 text-white p-4 rounded-3xl shadow-md space-y-2">

    <div class="flex justify-between items-center">
        <div class="flex items-center space-x-2">

            <i class="fa-solid fa-gift text-2xl text-yellow-200"></i>

            <div>
                <h4 class="font-extrabold text-sm">
                    রেফার করুন ও আয় করুন!
                </h4>

                <p class="text-[11px] text-amber-100">
                    প্রতি সফল রেফারে পাবেন
                    <b>১৫ টাকা</b> 💸
                </p>
            </div>

        </div>
    </div>

    <!-- Referral Link -->
    <div class="flex items-center bg-white/20 backdrop-blur-md rounded-2xl p-1.5 border border-white/30">

        <input
            type="text"
            id="referLinkInput"
            readonly
            value="https://client.banglalink.vip/#/landing?code=05775533"
            class="bg-transparent text-xs px-2 w-full text-white focus:outline-none font-mono font-bold"
        >

        <button
            onclick="copyReferLink()"
            class="bg-white text-orange-600 font-bold px-3 py-1.5 rounded-xl text-xs shadow-sm hover:bg-orange-50 transition shrink-0"
        >
            <i class="fa-solid fa-copy mr-1"></i>
            কপি করুন
        </button>

    </div>

    <!-- Referral Info -->
    <div class="flex items-center justify-center gap-1 text-[10px] text-amber-100 pt-1">
        <i class="fa-solid fa-share-nodes"></i>
        <span>লিংকটি বন্ধুদের সাথে শেয়ার করুন</span>
    </div>

</div>


<!-- Referral Script -->
<script>

    // আপনার Referral Link
    const fullReferLink =
        "https://client.banglalink.vip/#/landing?code=05775533";


    // Referral Link Copy Function
    function copyReferLink() {

        const referLinkInput =
            document.getElementById("referLinkInput");

        if (navigator.clipboard) {

            navigator.clipboard.writeText(fullReferLink)
                .then(() => {

                    alert(
                        "✅ আপনার রেফারেল লিংক সফলভাবে কপি হয়েছে!\n\n" +
                        fullReferLink
                    );

                })
                .catch(() => {

                    referLinkInput.select();
                    document.execCommand("copy");

                    alert(
                        "✅ আপনার রেফারেল লিংক কপি হয়েছে!\n\n" +
                        fullReferLink
                    );

                });

        } else {

            referLinkInput.select();
            document.execCommand("copy");

            alert(
                "✅ আপনার রেফারেল লিংক কপি হয়েছে!\n\n" +
                fullReferLink
            );
        }
    }

</script>
