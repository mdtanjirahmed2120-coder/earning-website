<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halal Income - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-tr from-purple-900 via-indigo-900 to-teal-800 min-h-screen flex items-center justify-center p-4 font-sans">

    <!-- Main Card Container -->
    <div class="bg-white/95 backdrop-blur-xl w-full max-w-md rounded-[35px] p-8 shadow-2xl border border-white/40 relative overflow-hidden">
        
        <!-- Decorative Glow Effect -->
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-purple-500/20 rounded-full blur-2xl"></div>
        <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-teal-500/20 rounded-full blur-2xl"></div>

        <!-- Header Section -->
        <div class="text-center mb-8 relative z-10">
            <div class="w-16 h-16 bg-gradient-to-tr from-purple-600 to-indigo-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-purple-200">
                <i class="fa-solid fa-mosque text-3xl"></i>
            </div>
            <h1 class="text-2xl font-black text-gray-800 tracking-wide">Halal Income</h1>
            <p class="text-xs text-gray-500 font-medium mt-1">Join Halal Income এ আপনাকে স্বাগতম</p>
        </div>

        <!-- Registration Form -->
        <form onsubmit="handleRegister(event)" class="space-y-4 relative z-10">
            
            <!-- Full Name -->
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-400">
                    <i class="fa-solid fa-user text-sm"></i>
                </span>
                <input type="text" id="fullName" placeholder="Full Name" required 
                    class="w-full pl-11 pr-4 py-3.5 bg-gray-50/80 border border-gray-200/80 rounded-2xl text-xs text-gray-800 font-medium focus:outline-none focus:border-purple-600 focus:bg-white transition shadow-sm">
            </div>

            <!-- Email Address -->
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-400">
                    <i class="fa-solid fa-envelope text-sm"></i>
                </span>
                <input type="email" id="email" placeholder="Email Address" required 
                    class="w-full pl-11 pr-4 py-3.5 bg-gray-50/80 border border-gray-200/80 rounded-2xl text-xs text-gray-800 font-medium focus:outline-none focus:border-purple-600 focus:bg-white transition shadow-sm">
            </div>

            <!-- Password -->
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-400">
                    <i class="fa-solid fa-lock text-sm"></i>
                </span>
                <input type="password" id="password" placeholder="Password (min 6 characters)" minlength="6" required 
                    class="w-full pl-11 pr-4 py-3.5 bg-gray-50/80 border border-gray-200/80 rounded-2xl text-xs text-gray-800 font-medium focus:outline-none focus:border-purple-600 focus:bg-white transition shadow-sm">
            </div>

            <!-- Confirm Password -->
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-400">
                    <i class="fa-solid fa-circle-check text-sm"></i>
                </span>
                <input type="password" id="confirmPassword" placeholder="Confirm Password" minlength="6" required 
                    class="w-full pl-11 pr-4 py-3.5 bg-gray-50/80 border border-gray-200/80 rounded-2xl text-xs text-gray-800 font-medium focus:outline-none focus:border-purple-600 focus:bg-white transition shadow-sm">
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" 
                class="w-full bg-gradient-to-r from-purple-600 via-indigo-600 to-teal-600 hover:from-purple-700 hover:to-teal-700 text-white font-bold py-4 rounded-2xl text-xs shadow-lg shadow-purple-200 transition transform active:scale-98 flex items-center justify-center gap-2 mt-2">
                <span>Create Account</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <!-- Footer Link -->
        <div class="text-center mt-6 relative z-10">
            <p class="text-xs text-gray-500">
                Already have an account? 
                <a href="index.html" class="font-bold text-purple-600 hover:text-purple-700 ml-1">Login</a>
            </p>
        </div>

    </div>

    <!-- Script -->
    <script>
        function handleRegister(event) {
            event.preventDefault();
            
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submitBtn');

            if (password !== confirmPassword) {
                alert('পাসওয়ার্ড দুটি মিলছে না! আবার চেষ্টা করুন।');
                return;
            }

            submitBtn.innerHTML = 'প্রসেসিং হচ্ছে...';
            submitBtn.disabled = true;

            // সফলভাবে রেজিস্ট্রেশন সিমুলেশন (এখানে ডাটা সেভ বা রিডirect করতে পারেন)
            setTimeout(() => {
                alert('রেজিস্ট্রেশন সফল হয়েছে! এখন লগইন করুন।');
                window.location.href = 'index.html'; // লগইন পেজে রিডirect করবে
            }, 1000);
        }
    </script>
</body>
</html>
