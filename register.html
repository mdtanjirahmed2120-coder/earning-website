<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halal Income - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-emerald-700 flex justify-center items-center gap-2">
                <i class="fa-solid fa-mosque"></i> Halal Income
            </h1>
            <p class="text-xs text-gray-500 mt-1">সৎ কাজ • হালাল আয়</p>
        </div>
        
        <h2 class="text-xl font-bold text-gray-800 mb-1">Create Account</h2>
        <p class="text-xs text-emerald-600 mb-4 font-semibold">আজই রেজিস্ট্রেশন করুন</p>

        <form action="login.html" class="space-y-3">
            <div>
                <label class="text-xs text-gray-600 font-medium">Full Name</label>
                <div class="relative mt-1">
                    <i class="fa-solid fa-user absolute left-3 top-3 text-gray-400 text-sm"></i>
                    <input type="text" placeholder="আপনার নাম লিখুন" required class="w-full pl-9 pr-3 py-2 border rounded-xl text-sm focus:outline-none focus:border-emerald-600">
                </div>
            </div>
            <div>
                <label class="text-xs text-gray-600 font-medium">Email Address</label>
                <div class="relative mt-1">
                    <i class="fa-solid fa-envelope absolute left-3 top-3 text-gray-400 text-sm"></i>
                    <input type="email" placeholder="ইমেইল এড্রেস" required class="w-full pl-9 pr-3 py-2 border rounded-xl text-sm focus:outline-none focus:border-emerald-600">
                </div>
            </div>
            <div>
                <label class="text-xs text-gray-600 font-medium">Password</label>
                <div class="relative mt-1">
                    <i class="fa-solid fa-lock absolute left-3 top-3 text-gray-400 text-sm"></i>
                    <input type="password" placeholder="পাসওয়ার্ড (최소 6 অক্ষর)" required class="w-full pl-9 pr-3 py-2 border rounded-xl text-sm focus:outline-none focus:border-emerald-600">
                </div>
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-sm mt-2 transition">
                Register
            </button>
        </form>

        <p class="text-xs text-center text-gray-600 mt-4">
            Already have an account? <a href="login.html" class="text-emerald-700 font-bold underline">Login</a>
        </p>
    </div>
</body>
</html>
