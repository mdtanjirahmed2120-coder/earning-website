<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login — Halal Income</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="bg-slate-950 min-h-screen text-white">

<div class="max-w-md mx-auto min-h-screen px-5 py-8">

    <a href="index.html"
    class="text-slate-400 text-sm">
        <i class="fa-solid fa-arrow-left mr-2"></i> ফিরে যান
    </a>

    <div class="text-center mt-12">

        <div class="w-16 h-16 mx-auto rounded-2xl
        bg-gradient-to-br from-violet-500 to-blue-600
        flex items-center justify-center">
            <i class="fa-solid fa-lock text-2xl text-amber-300"></i>
        </div>

        <h1 class="text-2xl font-black mt-5">
            Welcome Back
        </h1>

        <p class="text-xs text-slate-400 mt-2">
            আপনার Account-এ Login করুন
        </p>

    </div>

    <form id="loginForm"
    class="bg-white/10 border border-white/10
    rounded-3xl p-5 mt-8">

        <label class="text-xs font-bold">
            মোবাইল নম্বর
        </label>

        <input id="phone"
        type="tel"
        placeholder="017XXXXXXXX"
        required
        class="w-full mt-2 px-4 py-3 rounded-xl
        bg-white/10 border border-white/10
        outline-none">

        <label class="text-xs font-bold block mt-4">
            Password
        </label>

        <input id="password"
        type="password"
        placeholder="আপনার Password"
        required
        class="w-full mt-2 px-4 py-3 rounded-xl
        bg-white/10 border border-white/10
        outline-none">

        <button
        class="w-full mt-6 py-3.5 rounded-xl
        bg-gradient-to-r from-violet-600 to-blue-600
        font-black">
            Login
        </button>

        <p id="message"
        class="text-center text-xs mt-4"></p>

    </form>

    <p class="text-center text-xs text-slate-400 mt-5">
        Account নেই?
        <a href="regetar.html"
        class="text-violet-400 font-bold">
            Register করুন
        </a>
    </p>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();

    const phone = document.getElementById("phone").value.trim();
    const password = document.getElementById("password").value.trim();
    const message = document.getElementById("message");

    if(phone.length < 11){
        message.textContent = "সঠিক মোবাইল নম্বর দিন।";
        message.className = "text-center text-xs mt-4 text-red-400";
        return;
    }

    if(password.length < 4){
        message.textContent = "Password সঠিকভাবে দিন।";
        message.className = "text-center text-xs mt-4 text-red-400";
        return;
    }

    /*
      IMPORTANT:
      আসল Login-এর জন্য এখানে backend authentication
      যুক্ত করতে হবে।
    */

    message.textContent =
        "Demo Login সফল। Backend যুক্ত করার পর আসল Dashboard Login হবে।";

    message.className =
        "text-center text-xs mt-4 text-emerald-400";

    setTimeout(function(){
        window.location.href = "dashboard.html";
    },1500);
});
</script>

</body>
</html>
