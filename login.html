<!DOCTYPE html><html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halal Income - Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head><body class="bg-gradient-to-br from-purple-50 to-blue-50 min-h-screen flex items-center justify-center p-4"><div class="bg-white p-7 rounded-[32px] shadow-2xl w-full max-w-md border border-purple-100"><div class="text-center mb-6"><div class="w-16 h-16 bg-gradient-to-tr from-purple-700 to-indigo-500 rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg">
<i class="fa-solid fa-mosque text-white text-2xl"></i>
</div><h1 class="text-2xl font-black text-gray-800">Halal Income</h1><p class="text-xs text-gray-500 mt-1">
আপনার অ্যাকাউন্টে লগইন করুন
</p></div><form id="loginForm" class="space-y-4"><div class="relative">
<i class="fa-solid fa-envelope absolute left-4 top-3.5 text-gray-400"></i>
<input id="email" type="email" placeholder="Email Address" required
class="w-full pl-11 py-3 bg-gray-50 border border-gray-200 rounded-2xl text-sm outline-none focus:border-purple-600">
</div><div class="relative">
<i class="fa-solid fa-lock absolute left-4 top-3.5 text-gray-400"></i>
<input id="password" type="password" placeholder="Password" required
class="w-full pl-11 py-3 bg-gray-50 border border-gray-200 rounded-2xl text-sm outline-none focus:border-purple-600">
</div><button class="w-full bg-gradient-to-r from-purple-700 to-indigo-600 text-white font-bold py-3.5 rounded-2xl shadow-lg">
Login Account
<i class="fa-solid fa-right-to-bracket ml-1"></i>
</button></form><p class="text-xs text-center text-gray-500 mt-5">
Don't have an account?
<a href="register.html" class="text-purple-700 font-bold">Register</a>
</p></div><script>

document.getElementById("loginForm").addEventListener("submit",function(e){

e.preventDefault();

const saved=localStorage.getItem("hi_user");

if(!saved){

alert("❌ আগে একটি Account Register করুন।");
location.href="register.html";
return;

}

const user=JSON.parse(saved);

const email=document.getElementById("email").value.trim().toLowerCase();
const password=document.getElementById("password").value;

if(email!==user.email || password!==user.password){

alert("❌ Email অথবা Password সঠিক নয়।");
return;

}

localStorage.setItem("hi_logged_in","true");

location.href="dashboard.html";

});

</script></body>
</html>
