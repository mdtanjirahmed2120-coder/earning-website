<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f3f5fa;
  padding:20px;
}

.box{
  width:100%;
  max-width:400px;
  background:white;
  padding:30px 24px;
  border-radius:24px;
  box-shadow:0 8px 30px #ddd;
}

.logo{
  text-align:center;
  font-size:45px;
  margin-bottom:10px;
}

h2{
  text-align:center;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#777;
  margin-bottom:25px;
}

label{
  display:block;
  margin:15px 0 7px;
  font-weight:bold;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none;
  font-size:15px;
}

button{
  width:100%;
  padding:15px;
  margin-top:25px;
  border:0;
  border-radius:13px;
  background:#3936d8;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.message{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  text-align:center;
  font-size:14px;
}

.error{
  display:block;
  background:#fff0f0;
  color:#c62828;
}

.success{
  display:block;
  background:#e7fff5;
  color:#08784f;
}

.register{
  text-align:center;
  margin-top:20px;
  color:#666;
}

.register a{
  color:#3936d8;
  font-weight:bold;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">💰</div>

  <h2>Welcome Back!</h2>

  <p class="subtitle">
    আপনার অ্যাকাউন্টে লগইন করুন
  </p>

  <form id="loginForm">

    <label>📱 মোবাইল নম্বর</label>

    <input
      type="tel"
      id="mobile"
      maxlength="11"
      inputmode="numeric"
      placeholder="01XXXXXXXXX"
      required
    >

    <label>🔑 পাসওয়ার্ড</label>

    <input
      type="password"
      id="password"
      placeholder="আপনার পাসওয়ার্ড"
      required
    >

    <button type="submit" id="loginBtn">
      🔐 Login
    </button>

    <div id="message" class="message"></div>

  </form>

  <div class="register">

    অ্যাকাউন্ট নেই?

    <a href="register.html">
      Register করুন
    </a>

  </div>

</div>

<script>

const form =
  document.getElementById("loginForm");

const message =
  document.getElementById("message");

const loginBtn =
  document.getElementById("loginBtn");


form.addEventListener("submit", function(e){

  e.preventDefault();

  const mobile =
    document.getElementById("mobile")
    .value
    .trim();

  const password =
    document.getElementById("password")
    .value;


  let user = null;


  /* Saved account read */

  try{

    const saved =
      localStorage.getItem("earningUser");

    if(saved){

      user = JSON.parse(saved);

    }

  }catch(error){

    user = null;

  }


  /* Account not found */

  if(!user){

    message.textContent =
      "❌ কোনো account পাওয়া যায়নি। আগে Register করুন।";

    message.className =
      "message error";

    return;

  }


  /* Mobile check */

  if(String(user.mobile) !== String(mobile)){

    message.textContent =
      "❌ মোবাইল নম্বর সঠিক নয়।";

    message.className =
      "message error";

    return;

  }


  /* Password check */

  if(String(user.password) !== String(password)){

    message.textContent =
      "❌ পাসওয়ার্ড সঠিক নয়।";

    message.className =
      "message error";

    return;

  }


  /* Login successful */

  user.loggedIn = true;


  localStorage.setItem(
    "earningUser",
    JSON.stringify(user)
  );


  message.textContent =
    "✅ Login সফল হয়েছে! Dashboard-এ যাচ্ছেন...";

  message.className =
    "message success";


  loginBtn.disabled = true;


  setTimeout(function(){

    window.location.replace("index.html");

  },800);

});

</script>

</body>
</html>
