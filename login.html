<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Earning Website</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#eef2ff,#f7f8ff);
  padding:20px;
}

.login-box{
  width:100%;
  max-width:400px;
  background:white;
  padding:30px 25px;
  border-radius:25px;
  box-shadow:0 8px 30px #ddd;
}

.logo{
  width:70px;
  height:70px;
  margin:0 auto 15px;
  border-radius:50%;
  background:linear-gradient(135deg,#3936d8,#164b9b);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:32px;
}

h2{
  text-align:center;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#777;
  margin-bottom:25px;
  font-size:14px;
}

label{
  display:block;
  margin:15px 0 7px;
  font-weight:bold;
  font-size:14px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none;
  font-size:15px;
  background:#fafbff;
}

input:focus{
  border-color:#3936d8;
}

button{
  width:100%;
  padding:15px;
  margin-top:25px;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,#3936d8,#164b9b);
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.message{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  text-align:center;
  font-size:14px;
}

.success{
  display:block;
  background:#e7fff5;
  color:#08784f;
}

.error{
  display:block;
  background:#fff0f0;
  color:#c62828;
}

.register{
  text-align:center;
  margin-top:20px;
  color:#666;
  font-size:14px;
}

.register a{
  color:#3936d8;
  font-weight:bold;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">💰</div>

  <h2>Welcome Back!</h2>

  <p class="subtitle">
    আপনার অ্যাকাউন্টে লগইন করুন
  </p>


  <form id="loginForm">

    <label>📱 মোবাইল নম্বর</label>

    <input
      type="tel"
      id="mobile"
      placeholder="01XXXXXXXXX"
      maxlength="11"
      inputmode="numeric"
      required
    >


    <label>🔑 পাসওয়ার্ড</label>

    <input
      type="password"
      id="password"
      placeholder="আপনার পাসওয়ার্ড"
      required
    >


    <button
      type="submit"
      id="loginBtn"
    >
      🔐 Login
    </button>


    <div
      id="message"
      class="message"
    ></div>

  </form>


  <div class="register">

    অ্যাকাউন্ট নেই?

    <a href="register.html">
      Register করুন
    </a>

  </div>

</div>
