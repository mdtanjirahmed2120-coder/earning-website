<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halal Income - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-6 rounded-3xl shadow-2xl w-full max-w-md border border-purple-100">
        
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-gradient-to-tr from-purple-700 to-indigo-500 rounded-full flex items-center justify-center mx-auto mb-2 shadow-lg">
                <i class="fa-solid fa-mosque text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-black text-gray-800 tracking-tight">Halal Income</h1>
            <p class="text-xs text-gray-500 mt-1 font-medium">Join Halal Income এ আপনাকে স্বাগতম</p>
        </div>

        <!-- ফর্ম জমা দিলে সরাসরি dashboard.html এ নিয়ে যাবে -->
        <form action="dashboard.html" class="space-y-3">
            <div class="relative">
                <i class="fa-solid fa-gift absolute left-4 top-3.5 text-gray-400"></i>
                <input type="text" value="800" readonly class="w-full pl-11 pr-4 py-3 bg-gray-100 border border-gray-200 rounded-2xl text-sm font-bold text-gray-600 focus:outline-none">
            </div>

            <div class="relative">
                <i class="fa-solid fa-user absolute left-4 top-3.5 text-purple-600"></i>
                <input type="text" placeholder="Full Name" required class="w-full pl-11 pr-4 py-3 border border-purple-200 rounded-2xl text-sm focus:outline-none focus:border-purple-600">
            </div>

            <div class="relative">
                <i class="fa-solid fa-envelope absolute left-4 top-3.5 text-gray-400"></i>
                <input type="email" placeholder="Email Address" required class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl text-sm focus:outline-none focus:border-purple-600">
            </div>

            <div class="relative">
                <i class="fa-solid fa-lock absolute left-4 top-3.5 text-gray-400"></i>
                <input type="password" placeholder="Password (min 6 characters)" required class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl text-sm focus:outline-none focus:border-purple-600">
            </div>

            <div class="relative">
                <i class="fa-solid fa-circle-check absolute left-4 top-3.5 text-gray-400"></i>
                <input type="password" placeholder="Confirm Password" required class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl text-sm focus:outline-none focus:border-purple-600">
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-purple-700 to-indigo-600 hover:from-purple-800 hover:to-indigo-700 text-white font-bold py-3.5 rounded-2xl text-sm shadow-lg shadow-purple-200 transition-all flex items-center justify-center gap-2 mt-4">
                <span>Create Account</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <p class="text-xs text-center text-gray-500 mt-5 font-medium">
            Already have an account? <a href="login.html" class="text-purple-700 font-bold hover:underline">Login</a>
        </p>
    </div>
</body>
</html>
