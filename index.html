<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registration - Earning Website</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#eef2ff,#f7f8ff);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.register-box{
  width:100%;
  max-width:430px;
  background:white;
  border-radius:25px;
  padding:30px 24px;
  box-shadow:0 10px 35px #cfd3e6;
}

.logo{
  width:70px;
  height:70px;
  margin:0 auto 15px;
  border-radius:50%;
  background:linear-gradient(135deg,#3936d8,#164b9b);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
}

h1{
  text-align:center;
  color:#222;
  font-size:27px;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#777;
  font-size:14px;
  margin-bottom:25px;
}

label{
  display:block;
  margin:15px 0 7px;
  color:#333;
  font-weight:bold;
  font-size:14px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none;
  font-size:15px;
  background:#fafbff;
}

input:focus{
  border-color:#5147d9;
  background:white;
}

.invite-info{
  margin-top:8px;
  color:#777;
  font-size:12px;
}

.register-btn{
  width:100%;
  margin-top:25px;
  padding:15px;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,#3936d8,#164b9b);
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.register-btn:active{
  transform:scale(.98);
}

.login-link{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#3936d8;
  text-decoration:none;
  font-weight:bold;
}

.home-link{
  display:block;
  text-align:center;
  margin-top:15px;
  color:#777;
  text-decoration:none;
  font-size:14px;
}

.message{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  text-align:center;
  font-size:14px;
}

.success{
  background:#e7fff5;
  color:#08784f;
}

.error{
  background:#fff0f0;
  color:#c62828;
}

@media(max-width:400px){
  .register-box{
    padding:25px 18px;
  }

  h1{
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="register-box">

  <div class="logo">💰</div>

  <h1>অ্যাকাউন্ট তৈরি করুন</h1>

  <p class="subtitle">
    Earning Website-এ আপনার নতুন অ্যাকাউন্ট খুলুন
  </p>

  <form id="registerForm">

    <label for="name">
      👤 আপনার নাম
    </label>

    <input
      type="text"
      id="name"
      placeholder="আপনার পূর্ণ নাম লিখুন"
      required
    >

    <label for="mobile">
      📱 মোবাইল নম্বর
    </label>

    <input
      type="tel"
      id="mobile"
      placeholder="01XXXXXXXXX"
      maxlength="11"
      required
    >

    <label for="password">
      🔑 পাসওয়ার্ড
    </label>

    <input
      type="password"
      id="password"
      placeholder="কমপক্ষে ৬ অক্ষর"
      minlength="6"
      required
    >

    <label for="confirmPassword">
      🔐 পাসওয়ার্ড আবার লিখুন
    </label>

    <input
      type="password"
      id="confirmPassword"
      placeholder="পাসওয়ার্ড নিশ্চিত করুন"
      minlength="6"
      required
    >

    <label for="inviteCode">
      🎟️ Invite Code
    </label>

    <input
      type="text"
      id="inviteCode"
      placeholder="Invite Code লিখুন"
    >

    <p class="invite-info">
      Referral link দিয়ে এলে Invite Code স্বয়ংক্রিয়ভাবে বসবে।
    </p>

    <button type="submit" class="register-btn">
      📝 Register করুন
    </button>

    <div id="message" class="message"></div>

  </form>

  <a href="login.html" class="login-link">
    🔐 আগে থেকেই অ্যাকাউন্ট আছে? Login করুন
  </a>

  <a href="index.html" class="home-link">
    🏠 Dashboard-এ ফিরে যান
  </a>

</div>

<script>

/* Referral link থেকে Invite Code নেওয়া */

const params = new URLSearchParams(window.location.search);
const refCode = params.get("ref");

const inviteInput = document.getElementById("inviteCode");

if(refCode){

  inviteInput.value = refCode;

  /*
    Referral link থেকে কোড এলে
    ব্যবহারকারী সেটি পরিবর্তন করতে পারবে না।
  */

  inviteInput.readOnly = true;

}


/* Registration form */

const form = document.getElementById("registerForm");
const message = document.getElementById("message");

form.addEventListener("submit", function(event){

  event.preventDefault();

  const name = document.getElementById("name").value.trim();
  const mobile = document.getElementById("mobile").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  const inviteCode = inviteInput.value.trim();

  /* নাম যাচাই */

  if(name.length < 2){

    showMessage("দয়া করে আপনার সঠিক নাম লিখুন।","error");
    return;

  }


  /* মোবাইল নম্বর যাচাই */

  if(!/^01[0-9]{9}$/.test(mobile)){

    showMessage("সঠিক ১১ সংখ্যার মোবাইল নম্বর দিন।","error");
    return;

  }


  /* Password যাচাই */

  if(password.length < 6){

    showMessage("পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।","error");
    return;

  }


  /* Confirm password */

  if(password !== confirmPassword){

    showMessage("দুইটি পাসওয়ার্ড একই নয়।","error");
    return;

  }


  /*
    এখন আপাতত Demo Registration।

    আসল account/database তৈরি করতে
    পরে backend/database যুক্ত করতে হবে।
  */

  const user = {
    name:name,
    mobile:mobile,
    inviteCode:inviteCode,
    registeredAt:new Date().toISOString()
  };

  localStorage.setItem("earningUser",JSON.stringify(user));

  showMessage("✅ Registration সফল হয়েছে!","success");

  setTimeout(function(){

    window.location.href = "index.html";

  },1500);

});


function showMessage(text,type){

  message.textContent = text;

  message.className = "message " + type;

  message.style.display = "block";

}

</script>

</body>
</html>
