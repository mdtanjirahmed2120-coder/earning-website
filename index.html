<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Earning Website</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#eef2ff,#f7f8ff);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:430px;
  background:white;
  padding:30px 24px;
  border-radius:25px;
  box-shadow:0 10px 35px #d4d7e5;
}

.logo{
  width:70px;
  height:70px;
  margin:0 auto 15px;
  border-radius:50%;
  background:linear-gradient(135deg,#3936d8,#164b9b);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:32px;
}

h1{
  text-align:center;
  font-size:27px;
  margin-bottom:8px;
}

.sub{
  text-align:center;
  color:#777;
  font-size:14px;
  margin-bottom:25px;
}

.ref-box{
  background:#f0f1ff;
  border:1px solid #3936d8;
  padding:12px;
  border-radius:12px;
  margin-bottom:18px;
  text-align:center;
  display:none;
}

.ref-box b{
  color:#3936d8;
}

label{
  display:block;
  margin:15px 0 7px;
  font-weight:bold;
  font-size:14px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none;
  font-size:15px;
  background:#fafbff;
}

input:focus{
  border-color:#3936d8;
}

button{
  width:100%;
  margin-top:25px;
  padding:15px;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,#3936d8,#164b9b);
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.message{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  text-align:center;
  font-size:14px;
}

.success{
  display:block;
  background:#e7fff5;
  color:#08784f;
}

.error{
  display:block;
  background:#fff0f0;
  color:#c62828;
}

.login{
  text-align:center;
  margin-top:20px;
  color:#666;
}

.login a{
  color:#3936d8;
  font-weight:bold;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">💰</div>

  <h1>অ্যাকাউন্ট তৈরি করুন</h1>

  <p class="sub">
    Earning Website-এ নতুন অ্যাকাউন্ট খুলুন
  </p>

  <!-- REFERRAL INFO -->

  <div id="refBox" class="ref-box">
    👥 আপনি Referral Link দিয়ে এসেছেন<br>
    Referral Code:
    <b id="refCodeText"></b>
  </div>


  <form id="registerForm">

    <label>👤 আপনার নাম</label>

    <input
      type="text"
      id="name"
      placeholder="আপনার পূর্ণ নাম"
      required
    >


    <label>📱 মোবাইল নম্বর</label>

    <input
      type="tel"
      id="mobile"
      placeholder="01XXXXXXXXX"
      maxlength="11"
      inputmode="numeric"
      required
    >


    <label>🔑 পাসওয়ার্ড</label>

    <input
      type="password"
      id="password"
      placeholder="কমপক্ষে ৬ অক্ষর"
      minlength="6"
      required
    >


    <label>🔐 পাসওয়ার্ড নিশ্চিত করুন</label>

    <input
      type="password"
      id="confirmPassword"
      placeholder="আবার পাসওয়ার্ড লিখুন"
      minlength="6"
      required
    >


    <button
      type="submit"
      id="registerBtn"
    >
      🚀 Register করুন
    </button>


    <div
      id="message"
      class="message"
    ></div>

  </form>


  <div class="login">

    আগে থেকেই অ্যাকাউন্ট আছে?

    <a href="login.html">
      Login করুন
    </a>

  </div>

</div>

/* =================================
   REFERRAL CODE
================================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const referralCode =
  (params.get("ref") || "")
  .trim()
  .toUpperCase();


if(referralCode){

  document.getElementById("refBox")
    .style.display = "block";

  document.getElementById("refCodeText")
    .textContent = referralCode;

}

function generateReferralCode(){

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let code = "";

  for(let i=0;i<8;i++){

    code += chars[
      Math.floor(
        Math.random()*chars.length
      )
    ];

  }

  return code;

}

function showMessage(text,type){

  message.textContent = text;

  message.className =
    "message " + type;

}
