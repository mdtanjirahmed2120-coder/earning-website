<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halal Income</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="bg-slate-950 min-h-screen text-white">

<div class="max-w-md mx-auto min-h-screen px-5 py-8">

    <div class="text-center pt-10">

        <div class="w-20 h-20 mx-auto rounded-3xl
        bg-gradient-to-br from-violet-600 to-blue-600
        flex items-center justify-center shadow-2xl">

            <i class="fa-solid fa-mosque text-4xl text-amber-300"></i>

        </div>

        <h1 class="text-3xl font-black mt-5">
            HALAL INCOME
        </h1>

        <p class="text-slate-400 text-sm mt-2">
            Premium Earning Platform
        </p>

    </div>


    <div class="mt-10 bg-white/10 border border-white/10
    rounded-3xl p-6 backdrop-blur-xl">

        <h2 class="text-xl font-black text-center">
            Halal Income-এ স্বাগতম
        </h2>

        <p class="text-xs text-slate-400 text-center mt-2">
            আপনার Account-এ প্রবেশ করুন অথবা নতুন Account তৈরি করুন।
        </p>


        <a href="login.html"
        class="block text-center mt-7 py-4 rounded-2xl
        bg-gradient-to-r from-violet-600 to-blue-600
        font-black shadow-xl">

            <i class="fa-solid fa-right-to-bracket mr-2"></i>
            Login

        </a>


        <a href="register.html"
        class="block text-center mt-3 py-4 rounded-2xl
        bg-white/10 border border-white/10 font-bold">

            <i class="fa-solid fa-user-plus mr-2"></i>
            নতুন Account খুলুন

        </a>

    </div>


    <div class="mt-7 grid grid-cols-3 gap-2 text-center">

        <div class="bg-white/5 rounded-2xl p-3">
            <i class="fa-solid fa-bolt text-amber-400"></i>
            <p class="text-[9px] mt-2 text-slate-400">Quick</p>
        </div>

        <div class="bg-white/5 rounded-2xl p-3">
            <i class="fa-solid fa-gift text-pink-400"></i>
            <p class="text-[9px] mt-2 text-slate-400">Referral</p>
        </div>

        <div class="bg-white/5 rounded-2xl p-3">
            <i class="fa-solid fa-wallet text-emerald-400"></i>
            <p class="text-[9px] mt-2 text-slate-400">Wallet</p>
        </div>

    </div>


    <p class="text-center text-[10px] text-slate-600 mt-10">
        © 2026 Halal Income
    </p>

</div>

</body>
</html>
