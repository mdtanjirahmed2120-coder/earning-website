<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Earning Website</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#eef2ff,#f7f8ff);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:430px;
  background:white;
  padding:30px 24px;
  border-radius:25px;
  box-shadow:0 10px 35px #d4d7e5;
}

.logo{
  width:70px;
  height:70px;
  margin:0 auto 15px;
  border-radius:50%;
  background:linear-gradient(135deg,#3936d8,#164b9b);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:32px;
}

h1{
  text-align:center;
  font-size:27px;
  margin-bottom:8px;
}

.sub{
  text-align:center;
  color:#777;
  font-size:14px;
  margin-bottom:25px;
}

label{
  display:block;
  margin:15px 0 7px;
  font-weight:bold;
  font-size:14px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none;
  font-size:15px;
  background:#fafbff;
}

input:focus{
  border-color:#3936d8;
  background:white;
}

.invite{
  background:#f0f1ff;
  border-color:#3936d8;
}

.note{
  margin-top:7px;
  color:#777;
  font-size:12px;
}

button{
  width:100%;
  margin-top:25px;
  padding:15px;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,#3936d8,#164b9b);
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.message{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  text-align:center;
  font-size:14px;
}

.success{
  display:block;
  background:#e7fff5;
  color:#08784f;
}

.error{
  display:block;
  background:#fff0f0;
  color:#c62828;
}

.links{
  text-align:center;
  margin-top:20px;
}

.links a{
  display:block;
  margin-top:12px;
  text-decoration:none;
  font-weight:bold;
  color:#3936d8;
}

.home{
  color:#777 !important;
  font-weight:normal !important;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">💰</div>

  <h1>অ্যাকাউন্ট তৈরি করুন</h1>

  <p class="sub">
    রেজিস্ট্রেশন করে আপনার Earning Account তৈরি করুন
  </p>

  <form id="registerForm">

    <label>👤 আপনার নাম</label>
    <input
      type="text"
      id="name"
      placeholder="আপনার পূর্ণ নাম"
      required
    >

    <label>📱 মোবাইল নম্বর</label>
    <input
      type="tel"
      id="mobile"
      placeholder="01XXXXXXXXX"
      maxlength="11"
      required
    >

    <label>🔑 পাসওয়ার্ড</label>
    <input
      type="password"
      id="password"
      placeholder="কমপক্ষে ৬ অক্ষর"
      minlength="6"
      required
    >

    <label>🔐 পাসওয়ার্ড নিশ্চিত করুন</label>
    <input
      type="password"
      id="confirmPassword"
      placeholder="আবার পাসওয়ার্ড লিখুন"
      minlength="6"
      required
    >

    <label>🎟️ Invite Code</label>
    <input
      type="text"
      id="inviteCode"
      class="invite"
      placeholder="Invite Code"
    >

    <p class="note">
      Referral link দিয়ে এলে Invite Code স্বয়ংক্রিয়ভাবে যুক্ত হবে।
    </p>

    <button type="submit">
      📝 Register করুন
    </button>

    <div id="message" class="message"></div>

  </form>

  <div class="links">

    <a href="login.html">
      🔐 আগে থেকেই অ্যাকাউন্ট আছে? Login করুন
    </a>

    <a href="index.html" class="home">
      🏠 Dashboard-এ ফিরে যান
    </a>

  </div>

</div>

<script>

/* =========================
   REFERRAL CODE
========================= */

const params = new URLSearchParams(window.location.search);
const ref = params.get("ref");

const inviteInput = document.getElementById("inviteCode");

if(ref){

  inviteInput.value = ref;

  /* Referral link থেকে এলে পরিবর্তন করা যাবে না */
  inviteInput.readOnly = true;

}


/* =========================
   REGISTER
========================= */

const form = document.getElementById("registerForm");
const message = document.getElementById("message");

form.addEventListener("submit", function(e){

  e.preventDefault();

  const name =
    document.getElementById("name").value.trim();

  const mobile =
    document.getElementById("mobile").value.trim();

  const password =
    document.getElementById("password").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  const inviteCode =
    inviteInput.value.trim();


  /* Device check */

  if(localStorage.getItem("earning_device_registered") === "yes"){

    showMessage(
      "❌ এই ডিভাইসে ইতিমধ্যে একটি অ্যাকাউন্ট তৈরি করা হয়েছে।",
      "error"
    );

    return;
  }


  /* Name */

  if(name.length < 2){

    showMessage(
      "দয়া করে আপনার সঠিক নাম লিখুন।",
      "error"
    );

    return;
  }


  /* Mobile */

  if(!/^01[0-9]{9}$/.test(mobile)){

    showMessage(
      "সঠিক ১১ সংখ্যার মোবাইল নম্বর দিন।",
      "error"
    );

    return;
  }


  /* Password */

  if(password.length < 6){

    showMessage(
      "পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।",
      "error"
    );

    return;
  }


  /* Confirm password */

  if(password !== confirmPassword){

    showMessage(
      "দুইটি পাসওয়ার্ড একই নয়।",
      "error"
    );

    return;
  }


  /*
    DEMO ACCOUNT

    নতুন account-এর starting balance = ৳10
  */

  const user = {

    name: name,

    mobile: mobile,

    inviteCode: inviteCode,

    balance: 10,

    loggedIn: true,

    registeredAt: new Date().toISOString()

  };


  /* Account save */

  localStorage.setItem(
    "earningUser",
    JSON.stringify(user)
  );


  /* Device registration mark */

  localStorage.setItem(
    "earning_device_registered",
    "yes"
  );


  /* Success message */

  showMessage(
    "✅ Registration সফল! ৳10 Bonus যোগ হয়েছে। Login করা হয়েছে।",
    "success"
  );


  /* Auto Login → Dashboard */

  setTimeout(function(){

    window.location.href = "index.html";

  },1500);

});


/* =========================
   MESSAGE
========================= */

function showMessage(text,type){

  message.textContent = text;

  message.className =
    "message " + type;

}

</script>

</body>
</html>
