<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halal Income - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans pb-10">

    <!-- Header Navbar -->
    <nav class="bg-emerald-700 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-mosque text-xl"></i>
            <span class="text-lg font-bold">Halal Income</span>
        </div>
        <div class="flex items-center space-x-3">
            <span class="bg-emerald-800 text-xs px-2.5 py-1 rounded-full border border-emerald-500">ID: HI12345</span>
            <a href="login.html" class="text-xs bg-red-500 px-2 py-1 rounded hover:bg-red-600">Logout</a>
        </div>
    </nav>

    <div class="max-w-md mx-auto p-4 space-y-4">

        <!-- Account Activate Alert Banner -->
        <div class="bg-red-500 text-white p-4 rounded-2xl shadow-lg flex justify-between items-center">
            <div>
                <p class="text-xs opacity-90">অ্যাকাউন্ট স্ট্যাটাস: নিষ্ক্রিয়</p>
                <h3 class="font-bold text-sm">অ্যাক্টিভেট করতে ১০ টাকা লাগবে</h3>
            </div>
            <button onclick="alert('bKash/Nagad: 017XXXXXXXX নম্বরে ১০ টাকা Send Money করে TrxID দিন।')" class="bg-white text-red-600 font-bold px-3 py-1.5 rounded-xl text-xs shadow hover:bg-gray-100">
                অ্যাক্টিভ করুন
            </button>
        </div>

        <!-- Wallet Card -->
        <div class="bg-emerald-800 text-white p-5 rounded-2xl shadow-xl flex justify-between items-center">
            <div>
                <p class="text-xs opacity-80">Available Balance</p>
                <h1 class="text-3xl font-extrabold mt-1">৳ <span id="balance">0.00</span></h1>
            </div>
            <button class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-4 py-2 rounded-xl text-xs border border-emerald-400 shadow">
                Withdraw
            </button>
        </div>

        <!-- Jobs Grid -->
        <h2 class="font-bold text-gray-800 text-sm">Premium Projects</h2>
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center text-center cursor-pointer hover:shadow-md transition">
                <i class="fa-brands fa-facebook text-blue-600 text-3xl mb-1"></i>
                <span class="font-semibold text-xs text-gray-700">Facebook Job</span>
                <span class="text-xs text-emerald-600 font-bold mt-1">+৳২.০০</span>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center text-center cursor-pointer hover:shadow-md transition">
                <i class="fa-brands fa-youtube text-red-600 text-3xl mb-1"></i>
                <span class="font-semibold text-xs text-gray-700">Video Job</span>
                <span class="text-xs text-emerald-600 font-bold mt-1">+৳৩.০০</span>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center text-center cursor-pointer hover:shadow-md transition">
                <i class="fa-solid fa-gift text-amber-500 text-3xl mb-1"></i>
                <span class="font-semibold text-xs text-gray-700">Daily Bonus</span>
                <span class="text-xs text-emerald-600 font-bold mt-1">+৳১.০০</span>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center text-center cursor-pointer hover:shadow-md transition">
                <i class="fa-solid fa-users text-purple-600 text-3xl mb-1"></i>
                <span class="font-semibold text-xs text-gray-700">Refer & Earn</span>
                <span class="text-xs text-emerald-600 font-bold mt-1">+৳৫.০০</span>
            </div>
        </div>
    </div>
</body>
</html>
